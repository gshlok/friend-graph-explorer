<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Network nodes -->
  <circle cx="50" cy="30" r="8" fill="#ffffff"/>
  <circle cx="30" cy="60" r="8" fill="#ffffff"/>
  <circle cx="70" cy="60" r="8" fill="#ffffff"/>
  <circle cx="50" cy="70" r="8" fill="#ffffff"/>
  
  <!-- Connection lines -->
  <line x1="50" y1="30" x2="30" y2="60" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="50" y1="30" x2="70" y2="60" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="30" y1="60" x2="50" y2="70" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="70" y1="60" x2="50" y2="70" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="30" y1="60" x2="70" y2="60" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
</svg>
